name: benchmark-XK
description: |
  Use when: Measuring the value of an explicit planning step (cheap-impl arm).
  Cell: plan=NONE (skipped), impl=Kimi. The implementer designs the approach
        itself directly from exploration, then implements it. Explore +
        self-review held constant on Sonnet. PR labeled `benchmark:XK`.
  NOT for: Production dark-factory dispatch.

provider: claude
model: sonnet

nodes:
  - id: fetch-issue
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(echo "$ARGUMENTS" | grep -oE '[0-9]+' | head -1)
      if [ -z "$ISSUE_NUM" ]; then
        echo "ERROR: No issue number in arguments: $ARGUMENTS" >&2
        exit 1
      fi
      echo "$ISSUE_NUM" > "$ARTIFACTS_DIR/.issue-number"
      gh issue view "$ISSUE_NUM" --json number,title,body,labels,author,createdAt
    timeout: 20000

  - id: explore
    prompt: |
      You are a codebase explorer. Read the issue and gather context needed
      to fix it. Do NOT edit anything in this node.

      ## Issue
      $fetch-issue.output

      ## Instructions

      Use Read, Grep, and Glob to explore the repository. Look for:
      - Files and modules involved in the issue
      - Existing patterns and conventions to follow
      - Tests that cover the affected code
      - Constraints in CLAUDE.md, MISSION.md, or FACTORY_RULES.md

      Write your output to `$ARTIFACTS_DIR/exploration.md` with sections:
      - **What the issue asks**: one paragraph rephrasing the issue
      - **Relevant files**: bullet list with paths
      - **Relevant patterns**: any code patterns or constraints the fix must respect
      - **Risks / edge cases**: what could go wrong

      Keep it focused - under 500 words. Do NOT propose a solution here.
    depends_on: [fetch-issue]
    context: fresh

  # NO PLAN NODE. The implementer designs the approach itself.

  - id: implement
    prompt: |
      You are a senior engineer fixing this issue end to end. There is NO separate
      planning step - you decide the approach AND implement it in this node.

      ## Issue
      $fetch-issue.output

      ## Exploration
      Read `$ARTIFACTS_DIR/exploration.md` for context.

      ## Instructions

      1. Work out the right fix yourself: the root cause (for a bug) or the design
         (for a feature), which files to change, and the minimal surgical edits.
      2. Make the edits. Use Read/Edit/Write/Bash tools. Stay strictly in scope -
         only touch what the fix genuinely needs. Add tests where appropriate.
      3. Run cheap sanity checks if applicable (e.g. import the module to check for
         syntax errors). Do NOT run the full test suite or build.
      4. When done editing, stage and commit:
         `git add -A && git commit -m "impl: address issue"`
      5. Do NOT push or create a PR - the create-pr node handles that.
    provider: pi
    model: kimi-coding/kimi-for-coding
    depends_on: [explore]
    context: fresh

  - id: self-review
    prompt: |
      You are an independent reviewer. Read the current diff and review it
      against the issue.

      ## Issue
      $fetch-issue.output

      ## Instructions

      1. Run `git diff main...HEAD` (or `git log -p -1`) to see what changed.
      2. Critique the diff for:
         - **Solves the issue?** Does the change actually address what was asked?
         - **Subtle correctness**: async/await, types, edge cases, off-by-ones,
           cache/state lifecycle, regex backtracking.
         - **Scope creep**: did the implementer touch anything not needed?
         - **Missing tests**: are there test cases that should exist?
      3. Fix anything you find. Use Edit/Write tools. DO NOT add new scope.
      4. If you make changes, commit them:
         `git add -A && git commit -m "review: address self-review findings"`
      5. If nothing needs fixing, write `NOTHING_TO_FIX` to
         `$ARTIFACTS_DIR/review-result.txt`. Otherwise write a brief summary there.
    depends_on: [implement]
    context: fresh

  - id: create-pr
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(cat "$ARTIFACTS_DIR/.issue-number")
      BRANCH=$(git branch --show-current)
      CELL="XK"
      CELL_DESC="plan=NONE, impl=Kimi"
      RUN_ID=$(basename "$ARTIFACTS_DIR")

      git push -u origin "$BRANCH"

      BODY="Fixes #${ISSUE_NUM}

      **Benchmark cell:** \`${CELL}\` (${CELL_DESC})
      **Source run-id:** \`${RUN_ID}\`

      Held-constant: explore + self-review on Sonnet. No planning step.

      Produced by the mixed-provider routing benchmark (no-plan baseline).
      See \`benchmark-evaluator\` workflow for the scored verdict."

      PR_URL=$(gh pr create \
        --draft \
        --title "[bench-${CELL}] $(git log -1 --pretty=%s)" \
        --body "$BODY" \
        --label "benchmark:${CELL}")

      echo "Created draft PR: $PR_URL"
      PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' | tail -1)
      echo "$PR_NUM" > "$ARTIFACTS_DIR/.pr-number"
      echo "PR #${PR_NUM}"
    depends_on: [self-review]
    timeout: 60000
